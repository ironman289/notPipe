buildscript {
    repositories {
        google()
        mavenCentral()
        // Keep legacy repo if the original had it
        maven { url "https://maven.google.com" } 
    }
    dependencies {
        // Upgraded from 2.x to 3.6.4 to fix the base-extension XML parsing crash
        classpath 'com.android.tools.build:gradle:3.6.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.google.com" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
