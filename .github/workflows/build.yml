name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SDK platform 26 & build-tools 26.0.3
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$RUNNER_TEMP/android-sdk" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$RUNNER_TEMP/android-sdk" "platforms;android-26" "build-tools;26.0.3"

      - name: Set up JDK 8 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notPipe-debug-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
